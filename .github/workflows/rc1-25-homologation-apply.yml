name: MK9 DATE — RC1.25 Homologation Apply

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project reference (must be homologation tafjceemuetqjyngresg)
        required: true
        type: string
        default: tafjceemuetqjyngresg
      confirmation:
        description: Exact confirmation string required for RC1.25 execution (APLICAR RC1.25 HOMOLOGACAO)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mk9-homologation-rc1-25-apply
  cancel-in-progress: false

jobs:
  apply-rc1-25:
    if: github.ref == 'refs/heads/feat/rc1-25-promoter-skus-photos-edit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: homologation-backup
    env:
      GITHUB_REF: ${{ github.ref }}
      INPUT_PROJECT_REF: ${{ inputs.project_ref }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out isolated RC1.25 implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/rc1-25-promoter-skus-photos-edit
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          psql --version | grep -q '^psql (PostgreSQL) 17\.'

      - name: Run unit safety tests
        shell: bash
        run: |
          node --test scripts/safe-rc1-25-apply.test.mjs

      - name: Execute controlled RC1.25 application
        shell: bash
        run: |
          node -e '
            import { executeRc125HomologationApply } from "./scripts/safe-rc1-25-apply.mjs";
            executeRc125HomologationApply(process.env);
          '
