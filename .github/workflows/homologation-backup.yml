name: MK9 homologation backup validation

on:
  workflow_dispatch:
    inputs:
      confirm_homologation_only:
        description: Confirm that this run reads only the staging project and creates an encrypted backup.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mk9-homologation-backup
  cancel-in-progress: false

jobs:
  backup-and-restore-check:
    if: inputs.confirm_homologation_only && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: homologation-backup
    services:
      restore-db:
        image: postgres:17-bookworm
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: runner-only-not-a-project-credential
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Confirm required environment secrets exist
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_STORAGE_READ_JWT: ${{ secrets.SUPABASE_STORAGE_READ_JWT }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_REPOSITORY_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL SUPABASE_ANON_KEY SUPABASE_STORAGE_READ_JWT BACKUP_AGE_RECIPIENT BACKUP_AGE_IDENTITY BACKUP_REPOSITORY_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Environment secret/variable: ${name}"
              exit 1
            fi
          done
          if [[ "$BACKUP_AGE_RECIPIENT" != age1* ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT is not an age public recipient."
            exit 1
          fi

      - name: Check out application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run application tests, typecheck, and build
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Install age encryption utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get install --yes postgresql-client-17

      - name: Dump, encrypt, and test restore on isolated PostgreSQL 17
        id: database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: https://tafjceemuetqjyngresg.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_STORAGE_READ_JWT: ${{ secrets.SUPABASE_STORAGE_READ_JWT }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: node scripts/ci/mk9-homologation-backup.mjs

      - name: Store encrypted backup in private repository release
        if: always() && steps.database.outputs.encrypted_archive != ''
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          ENCRYPTED_ARCHIVE: ${{ steps.database.outputs.encrypted_archive }}
          BACKUP_SHA256: ${{ steps.database.outputs.encrypted_sha256 }}
          BACKUP_BYTES: ${{ steps.database.outputs.encrypted_bytes }}
          RESTORE_STATUS: ${{ steps.database.outputs.restore_status }}
        shell: bash
        run: |
          set -euo pipefail
          archive_repo='gustav-j3an/mk9-date-homologation-backups'
          repo_json="$(curl --fail --silent --show-error --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${archive_repo}")"
          private="$(jq -r '.private' <<<"$repo_json")"
          visibility="$(jq -r '.visibility' <<<"$repo_json")"
          if [[ "$private" != true || "$visibility" != 'private' ]]; then
            echo '::error::Backup destination is not private; refusing upload.'
            exit 1
          fi
          if [[ ! -f "$ENCRYPTED_ARCHIVE" ]]; then
            echo '::error::Encrypted archive is missing.'
            exit 1
          fi
          actual_sha="$(sha256sum "$ENCRYPTED_ARCHIVE" | cut -d ' ' -f 1)"
          actual_bytes="$(stat -c '%s' "$ENCRYPTED_ARCHIVE")"
          if [[ "$actual_sha" != "$BACKUP_SHA256" || "$actual_bytes" != "$BACKUP_BYTES" ]]; then
            echo '::error::Encrypted backup checksum or size changed before upload.'
            exit 1
          fi
          if (( actual_bytes >= 2147483648 )); then
            echo '::error::Encrypted backup exceeds GitHub release asset limit (2 GiB).'
            exit 1
          fi
          tag="homologation-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="Project ref: tafjceemuetqjyngresg\nSHA-256: ${actual_sha}\nBytes: ${actual_bytes}\nRestore check: ${RESTORE_STATUS}\nDatabase data is age-encrypted; recovery identity remains in the protected GitHub Environment."
          release_json="$(jq -n --arg tag "$tag" --arg title "Homologation backup ${GITHUB_RUN_ID}" --arg notes "$notes" '{tag_name:$tag,name:$title,body:$notes,prerelease:true,draft:false}')"
          release="$(curl --fail --silent --show-error --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" --header 'X-GitHub-Api-Version: 2022-11-28' --header 'Content-Type: application/json' --data "$release_json" "https://api.github.com/repos/${archive_repo}/releases")"
          upload_url="$(jq -r '.upload_url' <<<"$release" | sed 's/{?name,label}//')"
          release_url="$(jq -r '.html_url' <<<"$release")"
          if [[ -z "$upload_url" || "$upload_url" == null || -z "$release_url" || "$release_url" == null ]]; then
            echo '::error::GitHub did not return release upload metadata.'
            exit 1
          fi
          curl --fail --silent --show-error --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" --header 'X-GitHub-Api-Version: 2022-11-28' --header 'Content-Type: application/octet-stream' --data-binary "@${ENCRYPTED_ARCHIVE}" "${upload_url}?name=$(basename "$ENCRYPTED_ARCHIVE")" > /dev/null
          {
            echo '### Encrypted homologation backup'
            echo
            echo "- Private destination: [${tag}](${release_url})"
            echo "- SHA-256: \`${actual_sha}\`"
            echo "- Size: ${actual_bytes} bytes"
            echo "- Restore check: ${RESTORE_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require full restore validation
        if: always() && steps.database.outputs.encrypted_archive != '' && steps.database.outputs.restore_status != 'full'
        shell: bash
        run: |
          echo '::error::Backup is encrypted and stored, but full restoration was not proven. A vanilla PostgreSQL 17 restore is partial; use an authorized Supabase clone to validate managed extensions, roles, and platform schemas.'
          exit 1
