name: MK9 DATE — Homologation Connection Preflight

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project reference (must be homologation tafjceemuetqjyngresg)
        required: true
        type: string
        default: tafjceemuetqjyngresg

permissions:
  contents: read

concurrency:
  group: mk9-homologation-connection-test
  cancel-in-progress: false

jobs:
  connection-preflight:
    if: github.ref == 'refs/heads/codex/m42.5-homologation-connection-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: homologation-backup
    env:
      GITHUB_REF: ${{ github.ref }}
      INPUT_PROJECT_REF: ${{ inputs.project_ref }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out isolated connection test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/m42.5-homologation-connection-test
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          psql --version | grep -q '^psql (PostgreSQL) 17\.'

      - name: Execute secure read-only connection preflight
        shell: bash
        run: bash scripts/run-homologation-connection-test.sh
