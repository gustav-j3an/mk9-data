name: MK9 protected production backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select a Drive-only test on the M67 branch or production backup on main
        required: false
        type: choice
        options:
          - synthetic-test
          - production-backup
      confirm_production_backup:
        description: Type BACKUP_PRODUCTION only for an authorized production export
        required: false
        type: string
      confirm_private_zero_cost_destination:
        description: Confirm private Drive access and enough existing storage without purchase
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mk9-production-backup
  cancel-in-progress: false

jobs:
  synthetic-drive-test:
    if: github.ref == 'refs/heads/codex/m67-google-drive-backup'
    uses: ./.github/workflows/m67-drive-backup-synthetic-test.yml

  production-backup:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'production-backup' &&
      inputs.confirm_production_backup == 'BACKUP_PRODUCTION' &&
      inputs.confirm_private_zero_cost_destination
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-backup
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Enforce reviewed backup revision
        env:
          APPROVED_BACKUP_COMMIT: ${{ vars.APPROVED_BACKUP_COMMIT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$APPROVED_BACKUP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$APPROVED_BACKUP_COMMIT" ]]

      - name: Set up Node.js for Auth and Storage export
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'

      - name: Install locked export dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL 17 client and age
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          pg_dump --version | grep -q '^pg_dump (PostgreSQL) 17\.'
          age --version

      - name: Preflight private production Drive destination
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_NAME: ${{ vars.GOOGLE_DRIVE_BACKUP_FOLDER_NAME }}
        run: python3 scripts/mk9-drive-backup.py preflight

      - name: Export and encrypt production backup
        env:
          INPUT_CONFIRM_PRODUCTION_BACKUP: ${{ inputs.confirm_production_backup }}
          GITHUB_REF: ${{ github.ref }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_URL: ${{ vars.SUPABASE_PROJECT_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTIONS: 'true'
        run: bash scripts/mk9-production-backup.sh

      - name: Upload and verify encrypted production archive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_NAME: ${{ vars.GOOGLE_DRIVE_BACKUP_FOLDER_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/mk9-drive-backup.py upload \
            --file "$RUNNER_TEMP/mk9-production-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz.age"

      - name: Remove local archive and temporary plaintext
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- "$RUNNER_TEMP"/mk9-prod-backup-"${GITHUB_RUN_ID}"-"${GITHUB_RUN_ATTEMPT}".tar.gz.age
          rm -f -- "$RUNNER_TEMP"/mk9-production-backup-"${GITHUB_RUN_ID}"-"${GITHUB_RUN_ATTEMPT}".tar.gz.age
