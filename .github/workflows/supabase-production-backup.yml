name: MK9 production backup (manual, protected)

on:
  workflow_dispatch:
    inputs:
      confirm_production_backup:
        description: Type BACKUP_PRODUCTION to confirm an authorized production export
        required: true
        type: string
      confirm_zero_cost_quota:
        description: Confirm sufficient included GitHub Actions/storage quota and no overage billing for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mk9-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'private' && inputs.confirm_production_backup == 'BACKUP_PRODUCTION' && inputs.confirm_zero_cost_quota
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-backup
    steps:
      - name: Checkout the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js for Supabase Auth and Storage exporters
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'

      - name: Install locked export dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL 17 client and age
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          pg_dump --version | grep -q '^pg_dump (PostgreSQL) 17\.'
          age --version

      - name: Create encrypted, separated backup archive
        env:
          INPUT_CONFIRM_PRODUCTION_BACKUP: ${{ inputs.confirm_production_backup }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_URL: ${{ vars.SUPABASE_PROJECT_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: bash scripts/mk9-production-backup.sh

      - name: Upload encrypted private artifact (one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mk9-production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mk9-production-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove archive from runner workspace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/mk9-production-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz.age"
          if [[ -e "$archive" ]]; then
            rm -f -- "$archive"
          fi

\n