name: M37 recovery on PostgreSQL 17

on:
  push:
    branches: [feat/m37-1-pending-visits-safety]
    paths:
      - '.github/workflows/m37-recovery-postgres17.yml'
      - 'docs/m37.4-homologation-function-recovery.sql'
      - 'scripts/m37-recovery-postgres17.sh'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check PostgreSQL version and run isolated migration recovery
        run: bash scripts/m37-recovery-postgres17.sh

