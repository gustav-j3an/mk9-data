name: M67 Google Drive backup uploader tests

on:
  pull_request:
    paths:
      - '.github/workflows/m67-drive-backup-tests.yml'
      - '.github/workflows/supabase-production-backup.yml'
      - 'scripts/mk9-drive-backup.py'
      - 'scripts/mk9-production-backup.sh'
      - 'tests/test_mk9_drive_backup.py'
  push:
    branches:
      - 'codex/m67-google-drive-backup'

permissions:
  contents: read

jobs:
  synthetic-drive-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m py_compile scripts/mk9-drive-backup.py tests/test_mk9_drive_backup.py
      - name: Check backup shell syntax
        run: bash -n scripts/mk9-production-backup.sh
      - name: Test OAuth, resumable upload, privacy and integrity with synthetic fixtures
        run: python3 -m unittest discover -s tests -p 'test_mk9_drive_backup.py' -v
