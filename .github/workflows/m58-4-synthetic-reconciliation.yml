name: MK9 M58.4 synthetic PostgreSQL reconciliation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/m58-4-*'
      - 'scripts/m59-*'
      - 'src/utils/industryCode*'
      - 'src/views/IndustriesView.tsx'
      - 'supabase/migrations/202610*'

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/postgresql.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          test "$(command -v psql)" = '/usr/lib/postgresql/17/bin/psql'
          test "$(command -v pg_dump)" = '/usr/lib/postgresql/17/bin/pg_dump'
          psql --version | grep -q '^psql (PostgreSQL) 17\.'
          pg_dump --version | grep -q '^pg_dump (PostgreSQL) 17\.'
      - name: Create isolated PostgreSQL 17 Supabase stack and validate
        shell: bash
        run: bash scripts/m58-4-synthetic-reconciliation.sh
