name: MK9 RC1.25 isolated PostgreSQL 17 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rc1-25-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out isolated repository branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify clean remote environment (no secrets/production credentials)
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL SUPABASE_ANON_KEY SUPABASE_TEST_ANON_KEY SUPABASE_TEST_SERVICE_KEY ANON_KEY SERVICE_ROLE_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "Unexpected remote Supabase variable present: $name" >&2
              exit 1
            fi
          done
          echo "Remote Supabase credentials/configuration are strictly absent."

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'

      - name: Install PostgreSQL 17 client and verify Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          # Tentar instalar postgresql-client-17 oficial via APT caso a rede permita,
          # com retries e timeout resiliente. Se a rede externa falhar ou se o runner
          # já possuir psql ou docker, não abortar o step.
          install_pg17_apt() {
            sudo install -d -m 0755 /usr/share/keyrings
            curl -fsSL --retry 3 --connect-timeout 10 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
            echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-17
          }
          install_pg17_apt || echo "Aviso: Download do repositório APT do PostgreSQL falhou; o runner utilizará o container Docker nativo."
          docker --version

      - name: Run isolated PostgreSQL 17 validation
        shell: bash
        run: |
          chmod +x scripts/rc1-25-postgres17-runner.sh
          ./scripts/rc1-25-postgres17-runner.sh
