name: Publication status

on:
  push:
    branches:
      - main
      - recovery/mk9-date-completo
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report branch and production publication status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run publication:check
